{% extends 'base.html' %}
{% block content %}
  <div class="min-h-screen bg-background pt-20 flex items-center justify-center px-4">
    <div class="w-full max-w-md">
      <div class="bg-white rounded-2xl shadow-sm p-8">
        <h1 class="text-3xl font-bold mb-2">Вход</h1>
        <p class="text-secondary mb-6">Демо-логины: admin, employee, user1, user2. Пароль в исходной демо-логике не проверяется.</p>
        <form method="post" class="space-y-4">
          <input name="login"
                 required
                 placeholder="Логин"
                 class="w-full px-4 py-3 rounded-xl border">
          <input name="password"
                 type="password"
                 placeholder="Пароль"
                 class="w-full px-4 py-3 rounded-xl border">
          <button class="w-full px-5 py-3 bg-olive text-white rounded-xl font-semibold hover:bg-olive-dark">Войти</button>
        </form>
        <p class="text-sm text-secondary mt-6">Нет аккаунта? <a href="{{ url_for("register") }}"
    class="text-olive font-semibold hover:underline">Зарегистрироваться</a></p>
      </div>
    </div>
  </div>
{% endblock %}
