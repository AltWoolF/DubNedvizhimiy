{% extends 'base.html' %}
{% block content %}
  <div class="min-h-screen bg-background pt-20 md:pt-24">
    <div class="max-w-4xl mx-auto px-4 py-10">
      <h1 class="text-3xl md:text-4xl font-bold mb-3">Подача заявки</h1>
      <p class="text-secondary mb-8">Объект: <b>{{ property.title }}</b></p>
      <form method="post"
            class="bg-white rounded-2xl p-6 md:p-8 shadow-sm space-y-5">
        <div>
          <label class="block text-sm font-semibold mb-2">Тип заявки</label>
          <select name="application_type" class="w-full px-4 py-3 rounded-xl border">
            <option value="rent">Аренда</option>
            <option value="purchase">Покупка</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-semibold mb-2">Желаемый срок аренды, месяцев</label>
          <input name="desired_term"
                 type="number"
                 min="1"
                 placeholder="Например, 12"
                 class="w-full px-4 py-3 rounded-xl border">
        </div>
        <div>
          <label class="block text-sm font-semibold mb-2">Цель использования</label>
          <textarea name="purpose"
                    rows="5"
                    required
                    class="w-full px-4 py-3 rounded-xl border"
                    placeholder="Опишите планируемое использование объекта"></textarea>
        </div>
        <div class="grid md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold mb-2">Способ оплаты при покупке</label>
            <select name="payment_method" class="w-full px-4 py-3 rounded-xl border">
              <option value="">Не применимо</option>
              <option value="full">Полная оплата</option>
              <option value="installment">Рассрочка</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-semibold mb-2">Планируемая дата</label>
            <input name="planned_date"
                   type="date"
                   class="w-full px-4 py-3 rounded-xl border">
          </div>
        </div>
        <div class="p-4 rounded-xl bg-background text-sm text-secondary">После подачи заявка получит номер и появится в личном кабинете. Сотрудник администрации сможет перевести её в статусы «На рассмотрении», «Одобрена» или «Отклонена».</div>
        <button class="w-full px-6 py-4 bg-olive text-white rounded-xl font-semibold hover:bg-olive-dark">Отправить заявку</button>
      </form>
    </div>
  </div>
{% endblock %}
