{% extends 'base.html' %}
{% block content %}
  <div class="min-h-screen bg-background pt-20 flex items-center justify-center">
    <div class="text-center px-4">
      <h1 class="text-9xl font-bold text-olive/20 mb-4">404</h1>
      <h2 class="text-2xl md:text-3xl font-bold text-dark mb-4">Страница не найдена</h2>
      <p class="text-secondary mb-8">Запрашиваемая страница не существует или была перемещена</p>
      <a href="{{ url_for("index") }}"
         class="inline-flex items-center gap-2 px-8 py-4 bg-olive text-white font-semibold rounded-xl hover:bg-olive-dark">Вернуться на главную</a>
    </div>
  </div>
{% endblock %}
