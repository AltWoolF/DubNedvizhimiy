{% extends 'base.html' %}
{% block content %}
  <div class="min-h-screen bg-background pt-20 flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-lg">
      <div class="bg-white rounded-2xl shadow-sm p-8">
        <h1 class="text-3xl font-bold mb-2">Регистрация</h1>
        <p class="text-secondary mb-6">Создание личного кабинета заявителя</p>
        <form method="post" class="space-y-4">
          <input name="full_name"
                 required
                 placeholder="ФИО или наименование организации"
                 class="w-full px-4 py-3 rounded-xl border">
          <input name="login"
                 required
                 placeholder="Логин"
                 class="w-full px-4 py-3 rounded-xl border">
          <input name="email"
                 type="email"
                 placeholder="Email"
                 class="w-full px-4 py-3 rounded-xl border">
          <input name="phone"
                 placeholder="Телефон"
                 class="w-full px-4 py-3 rounded-xl border">
          <input name="password"
                 type="password"
                 placeholder="Пароль"
                 class="w-full px-4 py-3 rounded-xl border">
          <button class="w-full px-5 py-3 bg-olive text-white rounded-xl font-semibold hover:bg-olive-dark">Зарегистрироваться</button>
        </form>
        <p class="text-sm text-secondary mt-6">Уже есть аккаунт? <a href="{{ url_for("login") }}"
    class="text-olive font-semibold hover:underline">Войти</a></p>
      </div>
    </div>
  </div>
{% endblock %}
